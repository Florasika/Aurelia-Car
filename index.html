<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Premium Automotive House</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>

<!-- HERO -->
<section class="relative min-h-screen flex items-end overflow-hidden grain">
  <img src="https://images.unsplash.com/photo-1763165561886-a9391b2132c1?crop=entropy&cs=srgb&fm=jpg&q=85&w=2400" alt="" class="absolute inset-0 w-full h-full object-cover slow-zoom">
  <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/40 to-[#050505]/20"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-[#050505]/50 via-transparent to-transparent"></div>
  <div class="relative container-custom pb-32 pt-32 z-10 w-full">
    <p class="overline reveal" data-i18n="home.overline"></p>
    <h1 class="font-display text-5xl sm:text-6xl lg:text-8xl xl:text-9xl tracking-tighter font-light mt-6 max-w-5xl reveal d1 leading-[0.95]" style="white-space:pre-line" data-i18n="home.title"></h1>
    <p class="text-neutral-300 text-lg max-w-xl mt-8 reveal d2" data-i18n="home.sub"></p>
    <div class="flex flex-wrap gap-4 mt-10 reveal d3">
      <a href="models.html" class="btn-primary" data-i18n="home.explore"></a>
      <a href="configure.html" class="btn-secondary" data-i18n="home.configure"></a>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 border-t border-white/10 backdrop-blur-md bg-black/30 overflow-hidden">
    <div class="flex marquee whitespace-nowrap py-4" id="marquee"></div>
  </div>
</section>

<!-- HIGHLIGHTS : bento -->
<section class="container-custom py-32 scroll-reveal">
  <p class="overline" data-i18n="home.hl.over"></p>
  <h2 class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light mt-4 max-w-2xl mb-14" data-i18n="home.hl.title"></h2>
  <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    <div class="md:col-span-7 md:row-span-2 relative aspect-[16/12] md:aspect-auto md:min-h-[560px] overflow-hidden bg-[#0c0c0c] border border-neutral-900 group">
      <img src="https://images.unsplash.com/photo-1589240508375-8ad32cfcfcf4?crop=entropy&cs=srgb&fm=jpg&q=85&w=1600" alt="" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-tr from-black via-black/40 to-transparent"></div>
      <div class="on-image relative h-full flex flex-col justify-end p-8 md:p-12 text-white">
        <p class="text-[#E50000] text-3xl mb-3">⚡</p>
        <h3 class="font-display text-3xl md:text-4xl" data-i18n="home.perf"></h3>
        <p class="text-neutral-300 mt-2 max-w-md" data-i18n="home.perf.d"></p>
      </div>
    </div>
    <div class="md:col-span-5 min-h-[270px] bg-[#0c0c0c] border border-neutral-900 p-8">
      <p class="text-[#B39D82] text-3xl mb-3">◈</p>
      <h3 class="font-display text-2xl md:text-3xl" data-i18n="home.tech"></h3>
      <p class="text-neutral-400 mt-2 text-sm" data-i18n="home.tech.d"></p>
    </div>
    <div class="md:col-span-3 min-h-[270px] bg-[#0c0c0c] border border-neutral-900 p-8">
      <p class="text-[#B39D82] text-3xl mb-3">◇</p>
      <h3 class="font-display text-2xl" data-i18n="home.design"></h3>
      <p class="text-neutral-400 mt-2 text-sm" data-i18n="home.design.d"></p>
    </div>
    <div class="on-image md:col-span-2 min-h-[270px] bg-[#E50000] p-8 text-white">
      <p class="text-3xl mb-3">⚡︎</p>
      <h3 class="font-display text-2xl" data-i18n="home.elec"></h3>
      <p class="text-white/80 mt-2 text-sm" data-i18n="home.elec.d"></p>
    </div>
  </div>
</section>

<!-- MODÈLES PHARES -->
<section class="container-custom py-24 scroll-reveal">
  <div class="flex items-end justify-between gap-8 mb-14 flex-wrap">
    <div>
      <p class="overline" data-i18n="home.feat.over"></p>
      <h2 class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light mt-4" data-i18n="home.feat.title"></h2>
    </div>
    <a href="models.html" class="btn-ghost"><span data-i18n="home.seeall"></span> →</a>
  </div>
  <div id="featured" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</section>

<!-- SERVICES -->
<section class="bg-[#0a0a0a] border-y border-neutral-900 py-32 scroll-reveal">
  <div class="container-custom">
    <p class="overline" data-i18n="home.serv.over"></p>
    <h2 class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light mt-4 mb-14" data-i18n="home.serv.title"></h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a href="services.html" class="group p-10 bg-[#050505] border border-neutral-900 hover:border-[#E50000] transition-all duration-500 hover:-translate-y-1 no-underline text-white">
        <p class="text-[#B39D82] text-3xl">✦</p><h3 class="font-display text-2xl mt-6" data-i18n="svc.wash"></h3><p class="text-neutral-400 mt-3 text-sm" data-i18n="svc.wash.d"></p><p class="overline mt-8">→ <span data-i18n="svc.request"></span></p></a>
      <a href="services.html" class="group p-10 bg-[#050505] border border-neutral-900 hover:border-[#E50000] transition-all duration-500 hover:-translate-y-1 no-underline text-white">
        <p class="text-[#B39D82] text-3xl">⚙</p><h3 class="font-display text-2xl mt-6" data-i18n="svc.repair"></h3><p class="text-neutral-400 mt-3 text-sm" data-i18n="svc.repair.d"></p><p class="overline mt-8">→ <span data-i18n="svc.request"></span></p></a>
      <a href="services.html" class="group p-10 bg-[#050505] border border-neutral-900 hover:border-[#E50000] transition-all duration-500 hover:-translate-y-1 no-underline text-white">
        <p class="text-[#B39D82] text-3xl">✎</p><h3 class="font-display text-2xl mt-6" data-i18n="svc.custom"></h3><p class="text-neutral-400 mt-3 text-sm" data-i18n="svc.custom.d"></p><p class="overline mt-8">→ <span data-i18n="svc.request"></span></p></a>
    </div>
  </div>
</section>

<!-- TÉMOIGNAGES -->
<section class="container-custom py-32 scroll-reveal">
  <p class="overline" data-i18n="home.test.over"></p>
  <h2 class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light mt-4" data-i18n="home.test.title"></h2>
  <div id="testimonials" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-14"></div>
</section>

<!-- CTA FINAL -->
<section class="relative overflow-hidden">
  <div class="absolute inset-0">
    <img src="https://images.unsplash.com/photo-1744884275743-4b075af04f62?crop=entropy&cs=srgb&fm=jpg&q=85&w=2000" alt="" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-black/40"></div>
  </div>
  <div class="on-image relative container-custom py-32 text-white">
    <h2 class="font-display text-4xl sm:text-5xl lg:text-7xl tracking-tighter font-light max-w-3xl" data-i18n="home.cta.title"></h2>
    <p class="text-neutral-300 max-w-xl mt-6 text-lg" data-i18n="home.cta.sub"></p>
    <a href="test-drive.html" class="btn-primary mt-10" data-i18n="home.cta.btn"></a>
  </div>
</section>

<div id="footer"></div>

<script>
  const BRANDS = ["BMW","FERRARI","PORSCHE","MERCEDES","AUDI","CADILLAC","TOYOTA","PEUGEOT","RENAULT"];
  const TESTIMONIALS = [
    { name: "Léa Moreau", role: { fr: "Architecte, Paris", en: "Architect, Paris" }, car: "Porsche 911 GT3 RS",
      q: { fr: "Sept ans à attendre cette voiture. Aurelia a rendu l'expérience à la hauteur du rêve.", en: "Seven years waiting for this car. Aurelia made the experience match the dream." } },
    { name: "Marcus Chen", role: { fr: "CEO, Genève", en: "CEO, Geneva" }, car: "Mercedes EQS 580",
      q: { fr: "La livraison à domicile, le configurateur, le SAV. Tout est pensé.", en: "Home delivery, the configurator, after-sales. Everything is considered." } },
    { name: "Sofia Rinaldi", role: { fr: "Pilote amateur", en: "Amateur driver" }, car: "Ferrari SF90",
      q: { fr: "Je connais beaucoup de concessions. Aucune n'arrive à ce niveau de finesse.", en: "I know many dealerships. None reach this level of refinement." } },
  ];
  function render() {
    document.getElementById("marquee").innerHTML = [1, 2].map(() =>
      `<div class="flex items-center gap-16 px-8 shrink-0">${BRANDS.map((b) => `<span class="font-display text-lg tracking-[0.3em] text-neutral-400">${b}</span>`).join("")}</div>`).join("");
    document.getElementById("featured").innerHTML = getCars().filter((c) => c.featured).slice(0, 3).map(carCard).join("");
    document.getElementById("testimonials").innerHTML = TESTIMONIALS.map((x) => `
      <div class="p-8 border border-neutral-900 bg-[#0c0c0c]">
        <p class="text-lg text-neutral-200 leading-relaxed">« ${x.q[LANG]} »</p>
        <div class="mt-8 pt-6 border-t border-neutral-900">
          <p class="text-white text-sm">${x.name}</p><p class="text-xs text-neutral-500">${x.role[LANG]}</p>
          <p class="font-mono text-xs text-[#B39D82] mt-2">${x.car}</p>
        </div></div>`).join("");
  }
  render(); document.addEventListener("langchange", render);
</script>
</body>
</html>
