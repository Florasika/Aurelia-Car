<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Configurateur</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-24 pb-24 bg-[#050505] min-h-screen">
  <div class="container-custom">
    <p class="overline">/ <span data-i18n="c.title"></span></p>
    <div class="flex items-center gap-4 flex-wrap mt-2">
      <h1 id="title" class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light"></h1>
      <select id="car-select" class="bg-[#111] border border-neutral-800 px-4 py-2 text-sm text-white"></select>
    </div>

    <div class="mt-12 grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Aperçu -->
      <div class="lg:col-span-7">
        <div class="aspect-[4/3] overflow-hidden bg-[#0c0c0c] border border-neutral-900 relative">
          <img id="preview" src="" alt="" class="w-full h-full object-cover">
          <!-- teinte live : mix-blend-mode color -->
          <div id="tint" class="absolute inset-0 pointer-events-none" style="mix-blend-mode:color;opacity:.55;transition:background-color .5s"></div>
          <div class="absolute inset-0 pointer-events-none" style="background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.15));mix-blend-mode:multiply"></div>
          <div class="on-image absolute bottom-4 left-4 px-3 py-1.5 bg-black/60 backdrop-blur-md border border-white/10 flex items-center gap-2 text-white">
            <span id="dot" class="w-3 h-3 rounded-full border border-white/30"></span>
            <span id="color-label" class="font-mono text-[10px] tracking-[0.2em] uppercase"></span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-4">
          <div class="aspect-[16/10] overflow-hidden bg-[#0c0c0c] border border-neutral-900"><img id="wheel-img" class="w-full h-full object-cover" alt=""></div>
          <div class="aspect-[16/10] overflow-hidden bg-[#0c0c0c] border border-neutral-900"><img id="int-img" class="w-full h-full object-cover" alt=""></div>
        </div>
      </div>
      <!-- Options -->
      <div class="lg:col-span-5 space-y-10">
        <div><p class="overline mb-4" data-i18n="c.color"></p><div id="colors" class="flex flex-wrap gap-3"></div></div>
        <div><p class="overline mb-4" data-i18n="c.wheels"></p><div id="wheels" class="space-y-2"></div></div>
        <div><p class="overline mb-4" data-i18n="c.interior"></p><div id="interiors" class="flex flex-wrap gap-3"></div></div>
        <div><p class="overline mb-4" data-i18n="c.tech"></p><div id="tech" class="space-y-2"></div></div>
      </div>
    </div>

    <!-- Total -->
    <div class="mt-12 sticky bottom-6 z-30">
      <div class="glass-nav border border-neutral-800 px-6 md:px-10 py-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div><p class="overline" data-i18n="c.total"></p><p id="total" class="font-display text-3xl mt-1"></p></div>
        <button id="order-btn" class="btn-primary" data-i18n="c.order"></button>
      </div>
    </div>
  </div>
</main>

<!-- Modale commande -->
<div id="order-modal" class="modal">
  <form id="order-form" class="modal-card">
    <h3 class="font-display text-3xl" data-i18n="c.order"></h3>
    <p id="order-sum" class="text-neutral-400 mt-2 text-sm"></p>
    <div class="space-y-4 mt-6">
      <input name="full_name" required class="field" data-i18n-ph="f.name">
      <input name="email" type="email" required class="field" data-i18n-ph="f.email">
      <input name="phone" required class="field" data-i18n-ph="f.phone">
    </div>
    <div class="flex gap-3 mt-8">
      <button class="btn-primary flex-1" data-i18n="c.order"></button>
      <button type="button" id="order-cancel" class="btn-secondary" data-i18n="f.cancel"></button>
    </div>
  </form>
</div>
<div id="footer"></div>

<script>
  const cars = getCars();
  let car = getCar(new URLSearchParams(location.search).get("id")) || cars[0];
  let sel = { color: 0, wheel: 0, interior: 0, tech: new Set() };
  const modal = bindModal("order-modal");
  const $ = (id) => document.getElementById(id);

  function total() {
    let s = car.price + COLORS[sel.color].price + WHEELS[sel.wheel].price + INTERIORS[sel.interior].price;
    sel.tech.forEach((i) => (s += TECH[i].price));
    return s;
  }
  const plus = (p) => (p > 0 ? `+${fmtPrice(p)}` : "");
  const swatch = (hex) => `<span class="w-5 h-5 rounded-full border border-white/20" style="background:${hex}"></span>`;
  const row = (active, attr, title, sub, extra, box) => `
    <button ${attr} class="w-full flex items-center justify-between gap-4 px-4 py-3 border transition-colors text-left ${active ? "border-white bg-white/5" : "border-neutral-800 hover:border-neutral-600"}">
      <div class="flex items-center gap-3">
        ${box ? `<span class="w-4 h-4 border flex items-center justify-center text-[10px] text-white ${active ? "bg-[#E50000] border-[#E50000]" : "border-neutral-600"}">${active ? "✓" : ""}</span>` : ""}
        <div><p class="text-sm">${title}</p>${sub ? `<p class="text-xs text-neutral-500 mt-0.5">${sub}</p>` : ""}</div>
      </div>
      <span class="font-mono text-xs text-neutral-400">${extra}</span></button>`;

  function render() {
    $("title").textContent = `${car.brand} ${car.model}`;
    $("car-select").innerHTML = cars.map((c) => `<option value="${c.id}" ${c.id === car.id ? "selected" : ""}>${c.brand} ${c.model}</option>`).join("");
    $("preview").src = car.img;
    $("tint").style.backgroundColor = COLORS[sel.color].hex;
    $("dot").style.background = COLORS[sel.color].hex;
    $("color-label").textContent = COLORS[sel.color].name;
    $("wheel-img").src = WHEELS[sel.wheel].image;
    $("int-img").src = INTERIORS[sel.interior].image;

    const pill = (active, attr, hex, name, price) => `<button ${attr} class="flex items-center gap-3 px-3 py-2 border transition-colors ${active ? "border-white" : "border-neutral-800 hover:border-neutral-600"}">${swatch(hex)}<span class="text-xs tracking-wider uppercase">${name}</span>${price > 0 ? `<span class="font-mono text-[10px] text-neutral-500">${plus(price)}</span>` : ""}</button>`;
    $("colors").innerHTML = COLORS.map((c, i) => pill(sel.color === i, `data-color="${i}"`, c.hex, c.name, c.price)).join("");
    $("interiors").innerHTML = INTERIORS.map((c, i) => pill(sel.interior === i, `data-int="${i}"`, c.hex, c.name, c.price)).join("");
    $("wheels").innerHTML = WHEELS.map((w, i) => row(sel.wheel === i, `data-wheel="${i}"`, w.name, "", plus(w.price))).join("");
    $("tech").innerHTML = TECH.map((o, i) => row(sel.tech.has(i), `data-tech="${i}"`, o.name, o.description, plus(o.price), true)).join("");
    $("total").textContent = fmtPrice(total());
  }

  document.addEventListener("click", (e) => {
    const g = (a) => e.target.closest(`[data-${a}]`);
    if (g("color")) sel.color = +g("color").dataset.color;
    else if (g("int")) sel.interior = +g("int").dataset.int;
    else if (g("wheel")) sel.wheel = +g("wheel").dataset.wheel;
    else if (g("tech")) { const i = +g("tech").dataset.tech; sel.tech.has(i) ? sel.tech.delete(i) : sel.tech.add(i); }
    else return;
    render();
  });
  $("car-select").addEventListener("change", (e) => { car = getCar(e.target.value); sel = { color: 0, wheel: 0, interior: 0, tech: new Set() }; render(); });
  $("order-btn").addEventListener("click", () => { $("order-sum").textContent = `${car.brand} ${car.model} · ${fmtPrice(total())}`; modal.open(); });
  $("order-cancel").addEventListener("click", modal.close);
  $("order-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    Store.push("orders", {
      car_name: `${car.brand} ${car.model}`, color: COLORS[sel.color].name, wheel: WHEELS[sel.wheel].name,
      interior: INTERIORS[sel.interior].name, tech: [...sel.tech].map((i) => TECH[i].name), total: total(), ...f,
    });
    modal.close(); e.target.reset(); toast(t("c.ok"));
    setTimeout(() => (location.href = "index.html"), 1800);
  });
  render(); document.addEventListener("langchange", render);
</script>
</body>
</html>
