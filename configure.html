<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Configurateur</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="photos.js"></script><script src="recolor.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-24 pb-24 bg-[#050505] min-h-screen">
  <div class="container-custom">
    <p class="overline">/ <span data-i18n="c.title"></span></p>
    <div class="flex items-center gap-4 flex-wrap mt-2">
      <h1 id="title" class="font-display text-4xl sm:text-5xl lg:text-6xl tracking-tighter font-light"></h1>
      <select id="car-select" class="bg-[#111] border border-neutral-800 px-4 py-2 text-sm text-white max-w-[320px]"></select>
    </div>

    <div class="mt-12 grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Aperçu : la photo du modèle, carrosserie à la couleur choisie -->
      <div class="lg:col-span-7">
        <div class="studio relative aspect-[4/3] overflow-hidden border border-neutral-900" id="stage">
          <div id="stage-inner" class="absolute inset-0"></div>
          <div id="stage-busy" class="hidden absolute inset-0 items-center justify-center bg-black/30 backdrop-blur-sm overline text-white">…</div>
          <div class="on-image absolute bottom-4 left-4 px-3 py-1.5 bg-black/60 backdrop-blur-md border border-white/10 flex items-center gap-2 text-white">
            <span id="dot" class="w-3 h-3 rounded-full border border-white/30"></span><span id="color-label" class="font-mono text-[10px] tracking-[0.2em] uppercase"></span>
          </div>
        </div>
        <p id="note" class="text-xs text-neutral-500 mt-3 leading-relaxed"></p>
        <p id="credit" class="text-[11px] text-neutral-500 mt-1"></p>

        <div class="mt-8 border border-neutral-900 bg-[#0c0c0c] p-6">
          <p class="overline mb-4" data-i18n="c.summary"></p>
          <dl id="summary" class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-3 text-sm"></dl>
        </div>
      </div>

      <!-- Options -->
      <div class="lg:col-span-5 space-y-10">
        <div><p class="overline mb-4" data-i18n="c.color"></p><div id="colors" class="flex flex-wrap gap-3"></div></div>
        <div><p class="overline mb-4" data-i18n="c.wheels"></p><div id="wheels" class="space-y-2"></div></div>
        <div><p class="overline mb-4" data-i18n="c.interior"></p><div id="interiors" class="flex flex-wrap gap-3"></div></div>
        <div><p class="overline mb-4" data-i18n="c.tech"></p><div id="tech" class="space-y-2"></div></div>
      </div>
    </div>

    <div class="mt-12 sticky bottom-6 z-30">
      <div class="glass-nav border border-neutral-800 px-6 md:px-10 py-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div><p class="overline" data-i18n="c.total"></p><p id="total" class="font-display text-3xl mt-1"></p></div>
        <div class="flex gap-3"><button id="share" class="btn-secondary" data-i18n="c.share"></button><button id="order-btn" class="btn-primary" data-i18n="c.order"></button></div>
      </div>
    </div>
  </div>
</main>

<div id="order-modal" class="modal">
  <form id="order-form" class="modal-card">
    <h3 class="font-display text-3xl" data-i18n="c.order"></h3>
    <p id="order-sum" class="text-neutral-400 mt-2 text-sm"></p>
    <div class="space-y-4 mt-6">
      <input name="full_name" required class="field" data-i18n-ph="f.name"><input name="email" type="email" required class="field" data-i18n-ph="f.email"><input name="phone" required class="field" data-i18n-ph="f.phone">
    </div>
    <div class="flex gap-3 mt-8"><button class="btn-primary flex-1" data-i18n="c.order"></button><button type="button" id="order-cancel" class="btn-secondary" data-i18n="f.cancel"></button></div>
  </form>
  <div id="order-done" class="modal-card hidden text-center">
    <p class="overline text-[#E50000]">✓ <span data-i18n="c.ok"></span></p>
    <h3 id="order-ref" class="font-display text-4xl mt-3"></h3>
    <p class="text-neutral-400 mt-4 text-sm" data-i18n="c.thanks"></p>
    <a href="index.html" class="btn-primary mt-8 w-full" data-i18n="c.close"></a>
  </div>
</div>
<div id="footer"></div>

<script>
  const cars = getCars();
  const P = new URLSearchParams(location.search);
  let car = getCar(P.get("id")) || cars[0];
  // sel.color = null → couleur d'origine de la photo
  let sel = { color: null, wheel: 0, interior: 0, tech: new Set() };
  const modal = bindModal("order-modal");
  const $ = (id) => document.getElementById(id);
  const cslug = (c) => Photos.slugify(c.name);

  function fromUrl() {
    const c = P.get("color"); if (c !== null && COLORS[+c]) sel.color = +c;
    if (P.get("wheel") && WHEELS[+P.get("wheel")]) sel.wheel = +P.get("wheel");
    if (P.get("int") && INTERIORS[+P.get("int")]) sel.interior = +P.get("int");
    if (P.get("tech")) P.get("tech").split(",").filter((x) => TECH[+x]).forEach((x) => sel.tech.add(+x));
  }
  function toUrl() {
    const q = new URLSearchParams({ id: car.id });
    if (sel.color !== null) q.set("color", sel.color); if (sel.wheel) q.set("wheel", sel.wheel); if (sel.interior) q.set("int", sel.interior);
    if (sel.tech.size) q.set("tech", [...sel.tech].join(","));
    return q;
  }
  function total() {
    let s = car.price + (sel.color !== null ? COLORS[sel.color].price : 0) + WHEELS[sel.wheel].price + INTERIORS[sel.interior].price;
    sel.tech.forEach((i) => (s += TECH[i].price));
    return s;
  }
  const plus = (p) => (p > 0 ? `+${fmtPrice(p)}` : "");
  const swatch = (bg) => `<span class="w-5 h-5 rounded-full border border-white/20" style="background:${bg}"></span>`;
  const row = (active, attr, title, sub, extra, box) => `
    <button ${attr} class="w-full flex items-center justify-between gap-4 px-4 py-3 border transition-colors text-left bg-transparent text-white cursor-pointer ${active ? "border-white bg-white/5" : "border-neutral-800 hover:border-neutral-600"}">
      <div class="flex items-center gap-3">${box ? `<span class="w-4 h-4 border flex items-center justify-center text-[10px] text-white ${active ? "bg-[#E50000] border-[#E50000]" : "border-neutral-600"}">${active ? "✓" : ""}</span>` : ""}
        <div><p class="text-sm">${title}</p>${sub ? `<p class="text-xs text-neutral-500 mt-0.5">${sub}</p>` : ""}</div></div>
      <span class="font-mono text-xs text-neutral-400">${extra}</span></button>`;
  const pill = (active, attr, bg, name, price) => `<button ${attr} class="flex items-center gap-3 px-3 py-2 border transition-colors bg-transparent text-white cursor-pointer ${active ? "border-white" : "border-neutral-800 hover:border-neutral-600"}">${swatch(bg)}<span class="text-xs tracking-wider uppercase">${name}</span>${price > 0 ? `<span class="font-mono text-[10px] text-neutral-500">${plus(price)}</span>` : ""}</button>`;

  /* ----- aperçu : photo réelle de la couleur > teinte automatique > photo d'origine ----- */
  let token = 0;
  async function paint() {
    const my = ++token, inner = $("stage-inner"), note = $("note"), cr = $("credit");
    note.textContent = ""; cr.innerHTML = "";
    $("stage-busy").classList.replace("hidden", "flex");
    const done = () => { if (my === token) $("stage-busy").classList.replace("flex", "hidden"); };
    const show = (el) => { if (my !== token) return; inner.innerHTML = ""; el.className = "absolute inset-0 w-full h-full object-cover"; inner.appendChild(el); };
    const img = (url) => Object.assign(document.createElement("img"), { src: url, alt: `${car.brand} ${car.model}` });
    const credit = (p) => { if (my === token && p && p.credit) cr.innerHTML = `${t("ph.credit")} : ${p.link ? `<a class="underline" target="_blank" rel="noopener" href="${esc(p.link)}">${esc(p.credit)}</a>` : esc(p.credit)}`; };

    const color = sel.color !== null ? COLORS[sel.color] : null;
    if (color) {                                              // 1. photo réelle fournie pour cette couleur
      const real = await Photos.get(car, "main", cslug(color));
      if (real) { show(img(real.url)); note.textContent = t("c.note.local"); return done(); }
    }
    const base = await Photos.get(car, "main");
    if (!base) { inner.innerHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-neutral-500 text-center px-8">${brandLogo(car.brand, "h-12 w-12")}<p class="overline">${t("ph.none")}</p><p class="text-xs">${t("ph.hint")} <code class="font-mono">${esc(Photos.hint(car, "main"))}</code></p></div>`; note.textContent = t("c.note.none"); return done(); }
    credit(base);
    if (!color) { show(img(base.url)); return done(); }
    const res = await Recolor.tint(base.url, color.hex);      // 2. teinte automatique de la carrosserie
    if (my !== token) return;
    if (res.canvas) { show(res.canvas); note.textContent = t("c.note.tint"); }
    else {                                                    // 3. impossible : photo d'origine + explication
      show(img(base.url));
      note.innerHTML = res.error === "cors" ? esc(t("c.note.cors")) : `${esc(t("c.note.neutral"))} <code class="font-mono">${esc(Photos.hint(car, "main", cslug(color)))}</code>`;
    }
    done();
  }

  function render(repaint = true) {
    $("title").textContent = `${car.brand} ${car.model}`;
    $("car-select").innerHTML = carOptions(cars, car.id);
    const c = sel.color !== null ? COLORS[sel.color] : null;
    $("dot").style.background = c ? c.hex : "conic-gradient(#c8102e,#f2c200,#0f5a3a,#14306b,#c8102e)";
    $("color-label").textContent = c ? c.name : t("c.origin");
    $("colors").innerHTML = pill(sel.color === null, 'data-color="-1"', "conic-gradient(#c8102e,#f2c200,#0f5a3a,#14306b,#c8102e)", t("c.origin"), 0) + COLORS.map((x, i) => pill(sel.color === i, `data-color="${i}"`, x.hex, x.name, x.price)).join("");
    $("interiors").innerHTML = INTERIORS.map((x, i) => pill(sel.interior === i, `data-int="${i}"`, x.hex, x.name, x.price)).join("");
    $("wheels").innerHTML = WHEELS.map((w, i) => row(sel.wheel === i, `data-wheel="${i}"`, w.name, "", plus(w.price))).join("");
    $("tech").innerHTML = TECH.map((o, i) => row(sel.tech.has(i), `data-tech="${i}"`, o.name, o.description, plus(o.price), true)).join("");
    $("total").textContent = fmtPrice(total());
    const items = [[t("c.color"), c ? c.name : t("c.origin")], [t("c.wheels"), WHEELS[sel.wheel].name], [t("c.interior"), INTERIORS[sel.interior].name], [t("c.tech"), [...sel.tech].map((i) => TECH[i].name).join(", ") || "—"]];
    $("summary").innerHTML = items.map(([k, v]) => `<div><dt class="overline">${esc(k)}</dt><dd class="mt-1">${esc(v)}</dd></div>`).join("");
    history.replaceState(null, "", "?" + toUrl());
    if (repaint) paint();
  }

  document.addEventListener("click", (e) => {
    const g = (a) => e.target.closest(`[data-${a}]`);
    if (g("color")) { const v = +g("color").dataset.color; sel.color = v < 0 ? null : v; render(true); }
    else if (g("int")) { sel.interior = +g("int").dataset.int; render(false); }
    else if (g("wheel")) { sel.wheel = +g("wheel").dataset.wheel; render(false); }
    else if (g("tech")) { const i = +g("tech").dataset.tech; sel.tech.has(i) ? sel.tech.delete(i) : sel.tech.add(i); render(false); }
  });
  $("car-select").addEventListener("change", (e) => { car = getCar(e.target.value); render(true); });
  $("share").addEventListener("click", async () => {
    const url = location.href;
    try { await navigator.clipboard.writeText(url); } catch { prompt("URL", url); }
    toast(t("c.copied"));
  });
  $("order-btn").addEventListener("click", () => { $("order-form").classList.remove("hidden"); $("order-done").classList.add("hidden"); $("order-sum").textContent = `${car.brand} ${car.model} · ${fmtPrice(total())}`; modal.open(); });
  $("order-cancel").addEventListener("click", modal.close);
  $("order-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)), ref = "AUR-" + Date.now().toString(36).toUpperCase().slice(-6);
    Store.push("orders", { ref, car_name: `${car.brand} ${car.model}`, color: sel.color !== null ? COLORS[sel.color].name : "Origine", wheel: WHEELS[sel.wheel].name, interior: INTERIORS[sel.interior].name, tech: [...sel.tech].map((i) => TECH[i].name), total: total(), ...f });
    e.target.reset(); e.target.classList.add("hidden"); $("order-ref").textContent = ref; $("order-done").classList.remove("hidden");
  });
  fromUrl(); render(true);
  document.addEventListener("langchange", () => render(false));
</script>
</body>
</html>
