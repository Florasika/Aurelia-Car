<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Contact</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="photos.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-32 pb-8 bg-[#050505] min-h-screen">
  <div class="container-custom">
    <p class="overline">/ <span data-i18n="ct.title"></span></p>
    <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl tracking-tighter font-light mt-4" data-i18n="ct.title"></h1>
    <p class="text-neutral-400 mt-3 max-w-xl" data-i18n="ct.sub"></p>

    <div class="mt-16 grid grid-cols-1 lg:grid-cols-12 gap-16">
      <div class="lg:col-span-4 space-y-8">
        <div class="flex gap-4"><span class="text-[#B39D82]">⌖</span><p class="text-neutral-200" data-i18n="ct.addr"></p></div>
        <div class="flex gap-4"><span class="text-[#B39D82]">◷</span><p class="text-neutral-200" data-i18n="ct.hours"></p></div>
        <div class="flex gap-4"><span class="text-[#B39D82]">✉</span><p class="text-neutral-200">hello@aurelia-motors.com</p></div>
        <div class="flex gap-4"><span class="text-[#B39D82]">☎</span><p class="text-neutral-200">+33 1 42 60 38 22</p></div>
        <div class="aspect-[4/3] bg-[#0c0c0c] border border-neutral-900 overflow-hidden">
          <iframe title="map" src="https://www.openstreetmap.org/export/embed.html?bbox=2.302%2C48.864%2C2.314%2C48.872&layer=mapnik" class="w-full h-full" style="border:0;filter:grayscale(1);opacity:.8"></iframe>
        </div>
      </div>
      <div class="lg:col-span-8">
        <div id="success" class="hidden border border-[#E50000] bg-[#E50000]/5 p-12">
          <p class="overline text-[#E50000]">✓ sent</p><h2 class="font-display text-3xl mt-3" data-i18n="ct.ok"></h2>
        </div>
        <form id="form" class="space-y-8">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <label><span class="overline" data-i18n="f.name"></span><input name="full_name" required class="field"></label>
            <label><span class="overline" data-i18n="f.email"></span><input name="email" type="email" required class="field"></label>
            <label><span class="overline" data-i18n="f.phone"></span><input name="phone" class="field"></label>
            <label><span class="overline" data-i18n="f.subject"></span><input name="subject" required class="field"></label>
          </div>
          <label class="block"><span class="overline" data-i18n="f.message"></span><textarea name="message" rows="5" required class="field resize-none"></textarea></label>
          <button class="btn-primary" data-i18n="ct.send"></button>
        </form>
      </div>
    </div>
  </div>
</main>
<div id="footer"></div>
<script>
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    Store.push("contacts", Object.fromEntries(new FormData(e.target)));
    e.target.classList.add("hidden"); document.getElementById("success").classList.remove("hidden"); toast(t("ct.ok"));
  });
</script>
</body>
</html>
