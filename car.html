<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Fiche modèle</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-24 pb-8 bg-[#050505] min-h-screen"><div id="detail"></div></main>
<div id="footer"></div>

<script>
  const id = new URLSearchParams(location.search).get("id");
  const car = getCar(id) || getCars()[0];
  let viewIdx = 0, busy = false;

  const pool = [car.img, ...(car.gallery || [])].filter((v, i, a) => v && a.indexOf(v) === i);
  while (pool.length < 4) pool.push(pool[pool.length - 1]);
  const views = pool.slice(0, 4);

  function goTo(i) {
    if (busy) return; busy = true;
    const img = document.getElementById("viewer-img");
    img.style.opacity = 0; img.style.transform = "scale(.9)";
    setTimeout(() => { viewIdx = i; img.src = views[viewIdx]; img.style.opacity = 1; img.style.transform = "none"; updatePills(); }, 300);
    setTimeout(() => { busy = false; }, 800);
  }
  function updatePills() {
    document.querySelectorAll("[data-view]").forEach((b) => {
      const on = +b.dataset.view === viewIdx;
      b.className = "px-3 py-1.5 text-[10px] tracking-[0.2em] uppercase font-mono backdrop-blur-md transition-all " + (on ? "bg-white text-black" : "bg-black/40 text-neutral-300 border border-white/10 hover:bg-black/60");
    });
  }
  const stat = (v, u, l, ic) => `<div class="border border-neutral-900 bg-[#0c0c0c] p-5 hover:border-neutral-700 transition-colors">
      <div class="w-9 h-9 rounded-full bg-[#B39D82]/10 flex items-center justify-center text-[#B39D82]">${ic}</div>
      <p class="font-display text-3xl mt-4 leading-none">${v}<span class="text-base text-neutral-500 ml-1">${u}</span></p>
      <p class="text-[10px] tracking-[0.2em] uppercase font-mono text-neutral-500 mt-2">${l}</p></div>`;

  function render() {
    document.title = `AURELIA — ${car.brand} ${car.model}`;
    const labels = t("views").split(",");
    document.getElementById("detail").innerHTML = `
    <section class="container-custom mt-8 grid grid-cols-1 lg:grid-cols-12 gap-12">
      <div class="lg:col-span-4 lg:sticky lg:top-32 lg:self-start order-2 lg:order-1">
        <span class="inline-block px-3 py-1 bg-white/5 border border-white/10 rounded-full text-[10px] tracking-[0.2em] uppercase font-mono text-[#B39D82]">${t("type." + car.type)}</span>
        <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl tracking-tighter font-light mt-6 leading-[0.92]">
          <span class="block text-neutral-500">${car.brand}</span><span class="block">${car.model}</span></h1>
        <p class="text-neutral-300 mt-6 leading-relaxed text-sm">${car.desc[LANG]}</p>
        <p class="overline mt-8">${t("d.from")}*</p>
        <p class="font-display text-3xl mt-2">${fmtPrice(car.price)}</p>
        <div class="flex flex-wrap gap-3 mt-8">
          <a href="configure.html?id=${car.id}" class="btn-primary">${t("d.configure")} →</a>
          <button id="rot" class="w-12 h-12 border border-neutral-800 hover:border-white text-white" title="Rotate">↻</button>
        </div>
        <a href="test-drive.html?car=${car.id}" class="btn-ghost mt-6">${t("d.book")} →</a>
      </div>

      <div class="lg:col-span-5 order-1 lg:order-2">
        <div id="viewer" class="relative aspect-square overflow-hidden cursor-pointer select-none" style="background:radial-gradient(ellipse at center,#1a1a1a 0%,#050505 70%)">
          <img id="viewer-img" src="${views[viewIdx]}" alt="" class="absolute inset-0 w-full h-full object-cover" style="transition:all .7s cubic-bezier(.22,1,.36,1);animation:carReveal .8s both">
          <div class="on-image absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2 z-10">
            ${views.map((_, i) => `<button data-view="${i}">${labels[i]}</button>`).join("")}
          </div>
        </div>
      </div>

      <div class="lg:col-span-3 order-3 grid grid-cols-2 gap-3 content-start">
        ${stat(car.top, "km/h", t("d.top"), "≫")}
        ${stat(car.hp, "HP", t("d.power"), "◉")}
        ${car.range ? stat(car.range, "km", t("d.range"), "▮") : stat("∞", "", "ICE", "▮")}
        ${stat(car.acc, "s", t("d.acc"), "◔")}
        <div class="col-span-2 relative aspect-[16/10] overflow-hidden bg-[#0c0c0c] border border-neutral-900 group cursor-pointer">
          <img src="${views[2]}" alt="" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
          <div class="absolute inset-0 flex items-center justify-center"><div class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center group-hover:scale-110 transition-transform">▶</div></div>
        </div>
      </div>
    </section>

    <section class="container-custom mt-24">
      <p class="overline mb-6">${t("d.gallery")}</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${pool.map((g) => `<div class="aspect-[16/10] overflow-hidden bg-[#0c0c0c]"><img src="${g}" loading="lazy" alt="" class="w-full h-full object-cover hover:scale-105 transition-transform duration-1000"></div>`).join("")}
      </div>
    </section>`;
    updatePills();
    const next = () => goTo((viewIdx + 1) % views.length);
    document.getElementById("viewer").addEventListener("click", (e) => { if (!e.target.closest("[data-view]")) next(); });
    document.getElementById("rot").addEventListener("click", next);
    document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); goTo(+b.dataset.view); }));
  }
  render(); document.addEventListener("langchange", render);
</script>
</body>
</html>
