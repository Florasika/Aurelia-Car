<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Services</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-32 pb-8 bg-[#050505] min-h-screen">
  <div class="container-custom">
    <p class="overline">/ services</p>
    <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl tracking-tighter font-light mt-4" data-i18n="sv.title"></h1>
    <p class="text-neutral-400 mt-4 max-w-xl" data-i18n="sv.sub"></p>
    <div id="cards" class="mt-16 grid grid-cols-1 lg:grid-cols-3 gap-4"></div>
  </div>
</main>

<div id="modal" class="modal">
  <form id="form" class="modal-card relative">
    <button type="button" id="close" class="absolute top-4 right-4 text-neutral-400 hover:text-white bg-transparent border-0 cursor-pointer text-xl">✕</button>
    <h3 id="modal-title" class="font-display text-3xl"></h3>
    <div class="space-y-4 mt-6">
      <input name="full_name" required class="field" data-i18n-ph="f.name">
      <input name="email" type="email" required class="field" data-i18n-ph="f.email">
      <input name="phone" required class="field" data-i18n-ph="f.phone">
      <textarea name="message" rows="3" required class="field resize-none" data-i18n-ph="f.message"></textarea>
    </div>
    <button class="btn-primary w-full mt-6" data-i18n="sv.submit"></button>
  </form>
</div>
<div id="footer"></div>

<script>
  const SERVICES = [
    { key: "wash",   icon: "✦", img: IMG.black },
    { key: "repair", icon: "⚙", img: IMG.porsche },
    { key: "custom", icon: "✎", img: IMG.interior },
  ];
  let active = null;
  const modal = bindModal("modal");
  const $ = (id) => document.getElementById(id);

  function render() {
    $("cards").innerHTML = SERVICES.map((s) => `
      <article class="group bg-[#0c0c0c] border border-neutral-900 hover:border-neutral-700 transition-all">
        <div class="aspect-[4/3] overflow-hidden"><img src="${s.img}" loading="lazy" alt="" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000"></div>
        <div class="p-8">
          <p class="text-[#B39D82] text-3xl">${s.icon}</p>
          <h3 class="font-display text-2xl mt-4">${t("svc." + s.key)}</h3>
          <p class="text-neutral-400 mt-2 text-sm">${t("svc." + s.key + ".d")}</p>
          <button data-svc="${s.key}" class="btn-primary mt-8">${t("svc.request")}</button>
        </div>
      </article>`).join("");
    if (active) $("modal-title").textContent = t("svc." + active);
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-svc]");
    if (b) { active = b.dataset.svc; $("modal-title").textContent = t("svc." + active); modal.open(); }
  });
  $("close").addEventListener("click", modal.close);
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    Store.push("services", { service_type: active, ...Object.fromEntries(new FormData(e.target)) });
    e.target.reset(); modal.close(); toast(t("sv.ok"));
  });
  render(); document.addEventListener("langchange", render);
</script>
</body>
</html>
