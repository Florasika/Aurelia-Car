<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Modèles</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script><script src="common.js"></script>
</head>
<body class="bg-[#050505] text-white">
<div id="nav"></div>
<main class="pt-32 pb-8 bg-[#050505] min-h-screen">
  <div class="container-custom">
    <p class="overline">/ collection</p>
    <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl tracking-tighter font-light mt-4" data-i18n="models.title"></h1>
    <p class="text-neutral-400 mt-4 max-w-xl" data-i18n="models.sub"></p>

    <div class="mt-14 grid grid-cols-1 md:grid-cols-12 gap-8 pb-8 border-b border-neutral-900">
      <div class="md:col-span-4"><p class="overline mb-3" data-i18n="f.brand"></p><div id="brand-chips" class="flex flex-wrap gap-2"></div></div>
      <div class="md:col-span-4"><p class="overline mb-3" data-i18n="f.type"></p><div id="type-chips" class="flex flex-wrap gap-2"></div></div>
      <div class="md:col-span-4">
        <div class="flex items-center justify-between mb-3"><p class="overline" data-i18n="f.price"></p><p id="price-label" class="font-mono text-sm"></p></div>
        <input id="price" type="range" min="20000" max="500000" step="5000" value="500000">
        <button id="reset" class="overline mt-4 hover:text-white bg-transparent border-0 cursor-pointer">→ <span data-i18n="f.reset"></span></button>
      </div>
    </div>

    <div id="grid" class="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <p id="none" class="hidden text-neutral-500 text-center py-20" data-i18n="f.none"></p>
  </div>
</main>
<div id="footer"></div>

<script>
  const TYPES = ["all", "sport", "suv", "electric", "sedan"];
  const state = { brand: "all", type: "all", max: 500000 };
  const priceEl = document.getElementById("price");

  function render() {
    const cars = getCars();
    const brands = [...new Set(cars.map((c) => c.brand))];
    document.getElementById("brand-chips").innerHTML =
      ["all", ...brands].map((b) => `<button class="chip ${state.brand === b ? "active" : ""}" data-brand="${b}">${b === "all" ? t("f.all") : b}</button>`).join("");
    document.getElementById("type-chips").innerHTML =
      TYPES.map((x) => `<button class="chip ${state.type === x ? "active" : ""}" data-type="${x}">${t("type." + x)}</button>`).join("");
    document.getElementById("price-label").textContent = fmtPrice(state.max);

    const list = cars.filter((c) => (state.brand === "all" || c.brand === state.brand) && (state.type === "all" || c.type === state.type) && c.price <= state.max);
    document.getElementById("grid").innerHTML = list.map(carCard).join("");
    document.getElementById("none").classList.toggle("hidden", list.length > 0);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-brand]"), ty = e.target.closest("[data-type]");
    if (b) { state.brand = b.dataset.brand; render(); }
    if (ty) { state.type = ty.dataset.type; render(); }
  });
  priceEl.addEventListener("input", () => { state.max = +priceEl.value; render(); });
  document.getElementById("reset").addEventListener("click", () => { Object.assign(state, { brand: "all", type: "all", max: 500000 }); priceEl.value = 500000; render(); });
  render(); document.addEventListener("langchange", render);
</script>
</body>
</html>
